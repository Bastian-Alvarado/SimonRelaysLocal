<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Example Visualizer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #4C0A18; }
        canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    // --- State from parent ---
    let frequency = new Array(128).fill(0);
    let volume = 0;
    let bass = 0;
    let trackTitle = '';
    let trackArtist = '';
    let coverArtUrl = '';
    let lyrics = [];
    let activeLyricIndex = -1;

    // --- Aesthetic Colors (Fallback constants) ---
    let colors = {
        bg: '#4C0A18',          // Deep maroon fallback
        accent: '#D23F5D',      // Bright rose fallback
        accentMuted: '#C48494', // Light pink fallback
        gradient1: '#8A1E35'
    };

    // --- Image Handling ---
    const coverImg = new Image();
    let currentCoverUrl = '';
    let coverLoaded = false;
    let coverFadeAlpha = 0;

    coverImg.onload = () => {
        coverLoaded = true;
        coverFadeAlpha = 0; // Trigger fade-in
    };
    coverImg.onerror = () => {
        coverLoaded = false;
    };

    // --- Resize handler ---
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Helper to convert Hex to RGB/RGBA ---
    function hexToRgba(hex, alpha = 1) {
        if (!hex.startsWith('#')) return hex;
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // --- Helper to darken/desaturate a hex color for background ---
    function getDarkenedBgColor(hex) {
        if (!hex.startsWith('#')) return '#4C0A18';
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        // Reduce brightness drastically to create a beautiful deep velvet ambient color
        return `rgb(${Math.max(10, Math.floor(r * 0.28))}, ${Math.max(4, Math.floor(g * 0.08))}, ${Math.max(8, Math.floor(b * 0.12))})`;
    }

    // --- Helper to get darkened bar color for high contrast ---
    function getDarkenedBarColor(hex) {
        if (!hex.startsWith('#')) return 'rgba(0, 0, 0, 0.5)';
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        // Make it extremely dark and rich, darker than colors.bg but keeping accent hue
        const dr = Math.max(5, Math.floor(r * 0.14));
        const dg = Math.max(2, Math.floor(g * 0.04));
        const db = Math.max(4, Math.floor(b * 0.06));
        return `rgba(${dr}, ${dg}, ${db}, 0.75)`;
    }

    // --- PostMessage listener ---
    window.addEventListener('message', (e) => {
        if (!e.data || e.data.type !== 'audio-data') return;

        frequency = e.data.frequency || frequency;
        volume = e.data.volume || 0;
        bass = e.data.bass || 0;

        // Prevent empty metadata overwrites
        if (e.data.track) {
            const md = e.data.track.metadata || e.data.track;
            if (md.title) trackTitle = md.title;
            if (md.artist) trackArtist = md.artist;
        }

        // Handle cover art url updates
        if (e.data.coverArtUrl && e.data.coverArtUrl !== currentCoverUrl) {
            currentCoverUrl = e.data.coverArtUrl;
            coverLoaded = false;
            coverImg.src = e.data.coverArtUrl;
        }

        // Synced lyrics
        if (e.data.lyrics) lyrics = e.data.lyrics;
        if (typeof e.data.activeLyricIndex === 'number') {
            activeLyricIndex = e.data.activeLyricIndex;
        }

        // Track dynamic colors
        if (e.data.colors) {
            colors.accent = e.data.colors.accent || colors.accent;
            colors.gradient1 = e.data.colors.gradient1 || colors.gradient1;
            // Derivate deep background color from current track accent color
            colors.bg = getDarkenedBgColor(colors.accent);
            colors.accentMuted = hexToRgba(colors.accent, 0.65);
        }
    });

    // --- Main render loop ---
    let renderErrors = 0;
    function render() {
        try {
            const w = canvas.width;
            const h = canvas.height;
            const time = performance.now();

            // 1. Draw solid velvet background
            ctx.fillStyle = colors.bg;
            ctx.fillRect(0, 0, w, h);

            // 2. Draw ambient radial background gradient (Subtle glow)
            const radGrad = ctx.createRadialGradient(w / 2, h / 2, 10, w / 2, h / 2, w * 0.65);
            radGrad.addColorStop(0, hexToRgba(colors.accent, 0.12));
            radGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = radGrad;
            ctx.fillRect(0, 0, w, h);

            // 3. Define block dimensions (Centered layout matching screenshot)
            const blockW = Math.min(540, w * 0.85);
            const coverSize = 100;
            const gap = 20;
            const spectrumHeight = 60;
            const spectrumGap = 15;
            const blockH = spectrumHeight + spectrumGap + coverSize;

            const startX = (w - blockW) / 2;
            const startY = (h - blockH) / 2 - 20; // Shifted slightly up for lyric balance

            // --- A. Draw Spectrum (DIRECTLY ABOVE COVER & METADATA) ---
            const barCount = 42;
            const barSpacing = 3;
            const totalSpacing = barSpacing * (barCount - 1);
            const barW = (blockW - totalSpacing) / barCount;
            
            ctx.save();
            ctx.shadowColor = colors.accent;
            ctx.shadowBlur = 4 + bass * 6;

            for (let i = 0; i < barCount; i++) {
                // Map the frequency spectrum elements (prioritizing low to mid-highs)
                const freqIndex = Math.floor((i / barCount) * 75);
                const rawVal = frequency[freqIndex] || 0;
                
                // Add soft volume-based responsive heights
                let barH = (rawVal / 255) * spectrumHeight;
                barH = Math.max(3, barH * (0.85 + bass * 0.3));

                const barX = startX + i * (barW + barSpacing);
                const barY = startY + spectrumHeight - barH;

                // Draw rich high-contrast dark filled bars
                ctx.fillStyle = getDarkenedBarColor(colors.accent);
                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(barX, barY, barW, barH, [2, 2, 0, 0]);
                } else {
                    ctx.rect(barX, barY, barW, barH);
                }
                ctx.fill();

                // Draw high-contrast glowing outline
                ctx.strokeStyle = hexToRgba(colors.accent, 0.75 + volume * 0.25);
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            ctx.restore();

            // --- B. Draw Cover Art (LEFT SIDE) ---
            const coverX = startX;
            const coverY = startY + spectrumHeight + spectrumGap;

            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
            ctx.shadowBlur = 15;

            // Draw card background
            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(coverX, coverY, coverSize, coverSize, 8);
            } else {
                ctx.rect(coverX, coverY, coverSize, coverSize);
            }
            ctx.fill();

            // Draw glowing outline
            ctx.strokeStyle = hexToRgba(colors.accent, 0.25);
            ctx.lineWidth = 1;
            ctx.stroke();

            // Draw Loaded Cover Art image with smooth fade-in
            if (coverLoaded && currentCoverUrl) {
                if (coverFadeAlpha < 1) {
                    coverFadeAlpha += 0.04;
                }
                ctx.save();
                ctx.globalAlpha = coverFadeAlpha;
                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(coverX, coverY, coverSize, coverSize, 8);
                } else {
                    ctx.rect(coverX, coverY, coverSize, coverSize);
                }
                ctx.clip();
                ctx.drawImage(coverImg, coverX, coverY, coverSize, coverSize);
                ctx.restore();
            } else {
                // Beautiful minimalist custom music note fallback
                ctx.save();
                ctx.strokeStyle = hexToRgba(colors.accent, 0.5);
                ctx.fillStyle = hexToRgba(colors.accent, 0.4);
                ctx.lineWidth = 2;
                ctx.shadowColor = colors.accent;
                ctx.shadowBlur = 8;
                
                // Draw simple music note icon
                const centerX = coverX + coverSize / 2;
                const centerY = coverY + coverSize / 2;
                
                ctx.beginPath();
                ctx.arc(centerX - 8, centerY + 12, 6, 0, Math.PI * 2);
                ctx.arc(centerX + 8, centerY + 8, 5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(centerX - 2, centerY + 12);
                ctx.lineTo(centerX - 2, centerY - 14); // stem 1
                ctx.lineTo(centerX + 13, centerY - 18); // stem 2
                ctx.lineTo(centerX + 13, centerY + 8);
                ctx.stroke();

                // Flags
                ctx.fillStyle = hexToRgba(colors.accent, 0.5);
                ctx.beginPath();
                ctx.moveTo(centerX - 2, centerY - 14);
                ctx.lineTo(centerX + 13, centerY - 18);
                ctx.lineTo(centerX + 13, centerY - 8);
                ctx.lineTo(centerX - 2, centerY - 4);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
            ctx.restore();

            // --- C. Draw Track Metadata (RIGHT SIDE) ---
            const metaX = coverX + coverSize + gap;
            const metaY = coverY + coverSize / 2; // Center horizontally with Cover Art

            ctx.save();
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';

            // Title
            const titleFontSize = 26;
            ctx.font = `bold ${titleFontSize}px Outfit, sans-serif`;
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
            ctx.shadowBlur = 4;
            
            // Clip long titles gracefully
            const titleText = trackTitle || 'SIMPLE EXAMPLE';
            const maxTitleW = blockW - coverSize - gap;
            ctx.fillText(titleText, metaX, metaY - 14);

            // Artist
            const artistFontSize = 15;
            ctx.font = `500 ${artistFontSize}px Outfit, sans-serif`;
            ctx.fillStyle = hexToRgba('#ffffff', 0.65);
            ctx.fillText(trackArtist || 'UNKNOWN ARTIST', metaX, metaY + 16);
            ctx.restore();

            // --- 4. Draw Synced Lyrics (BOTTOM CENTER SCREEN) ---
            if (lyrics.length > 0 && activeLyricIndex >= 0) {
                const activeLine = lyrics[activeLyricIndex];
                if (activeLine && activeLine.text) {
                    ctx.save();
                    const lyricY = startY + blockH + 65;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    
                    ctx.font = 'bold 18px Outfit, sans-serif';
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = colors.accent;
                    ctx.shadowBlur = 8 + bass * 8;
                    
                    // Center the text
                    ctx.fillText(activeLine.text.toUpperCase(), w / 2, lyricY);
                    
                    // Render simple minimalist pulse bar underneath active lyric
                    const txtW = ctx.measureText(activeLine.text.toUpperCase()).width;
                    ctx.fillStyle = hexToRgba(colors.accent, 0.3 + bass * 0.4);
                    ctx.fillRect(w / 2 - txtW / 2, lyricY + 18, txtW, 1.5);
                    ctx.restore();
                }
            }

        } catch (err) {
            renderErrors++;
            if (renderErrors <= 5) {
                console.error('[Render Error in simple_example]', err.message, err.stack);
            }
        }

        requestAnimationFrame(render);
    }

    render();
</script>
</body>
</html>
